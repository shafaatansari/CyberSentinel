<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CyberSentinel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1220;
            color: white;
        }

        .card {
            width: 400px;
            padding: 35px;
            border-radius: 18px;
            background: #111c2e;
            border: 1px solid #263952;
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            color: #9ca9ba;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border-radius: 9px;
            border: 1px solid #34465f;
            background: #0b1424;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #4f8cff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #70a7ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🛡️ Create Account</h1>
        <p>Secure your CyberSentinel dashboard.</p>

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Create Account</button>
        </form>

        <div class="login">
            Already have an account?
            <a href="/login">Login</a>
        </div>
    </div>

</body>
</html>
